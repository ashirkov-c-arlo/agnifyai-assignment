court:
  width_m: 10.0
  length_m: 20.0
  net_y_m: 10.0
  service_line_offset_from_net_m: 6.95
  net_height_center_m: 0.88
  net_height_posts_m: 0.92
  lines:
    - near_baseline
    - far_baseline
    - left_sideline
    - right_sideline
    - net_line
    - near_service_line
    - far_service_line
    - near_center_service_line
    - far_center_service_line

zones:
  net_distance_from_net_m: 3.5
  mid_distance_from_net_m: 6.95
  # baseline is 6.95..10.0 from net

detection:
  model: yolo11l
  confidence_threshold: 0.5
  inference_confidence_threshold: 0.1
  person_class_id: 0
  max_detections_per_frame: 10

tracking:
  method: bytetrack
  min_track_duration_s: 1.0
  max_active_players: 4
  bytetrack:
    track_thresh: 0.5
    track_low_thresh: 0.1
    new_track_thresh: 0.5
    track_buffer: 30
    match_thresh: 0.8
    min_box_area: 100
    frame_rate: 30

calibration:
  frame_sample_interval_s: 2.0
  min_frames_for_registration: 5
  max_reprojection_error_px: 10.0
  method: deeplsd  # deeplsd or hough
  deeplsd:
    weights_url: "https://cvg-data.inf.ethz.ch/DeepLSD/deeplsd_md.tar"
    # https://cvg-data.inf.ethz.ch/DeepLSD/deeplsd_wireframe.tar
    weights_path: data/models/deeplsd_md.tar
    target_width: 640
    target_height: 480

smoothing:
  method: kalman  # savgol or kalman
  window_frames: 7
  polyorder: 3
  max_speed_mps: 8.0

ball_tracking:
  model: tracknetv4
  confidence_threshold: 0.3
  fallback_to_heuristic: true
  max_gap_frames: 10
  max_interpolation_step_px: 220.0
  kalman_process_noise: 0.1
  kalman_gate:
    threshold: 10.0
    min_pixel_radius: 90.0
    q_gap_factor: 2.0
    q_speed_factor: 0.1
  court_roi:
    mode: auto
    min_confidence: 0.5
    min_area_pct: 35.0
  tracknetv4:
    repo_path: third_party/TrackNetV4/src
    model_path: data/models/best_model_V1_NF_RIO_10u_e17.keras
    input_width: 512
    input_height: 288
    score_threshold: 0.5
    candidate_selection: temporal_mass
    max_jump_px: 220.0
    reacquire_gap_frames: 6

scoreboard:
  enabled: true
  ocr_engine: paddleocr
  sample_interval_s: 3.0
  vlm:
    enabled: true
    model_id: "qwen.qwen3-vl-235b-a22b"
    region: "us-east-1"
    timeout_s: 30
    max_failures: 3

export:
  formats:
    - json
    - csv
  video:
    annotated: true
    minimap: true
    max_player_gap_fill_frames: 15
    fps: null  # null = same as input

models:
  cache_dir: data/models
  lazy_download: true
